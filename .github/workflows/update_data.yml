name: Daily BC MLA Data Scrape

on:
  schedule:
    # Runs at 8:00 AM UTC every day (which is Midnight/1:00 AM in BC)
    - cron: "0 8 * * *"
  # This allows you to manually trigger a run from the GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    # Required to allow the action to push code back to your repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run Scraper
        run: |
          mkdir -p docs
          bc-mla-scraper --csv docs/bc_mlas.csv --json docs/bc_mlas.json

      - name: Commit and push changes
        run: |
          # Configure git as the automated GitHub Actions bot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Add the generated data files
          git add docs/bc_mlas.csv docs/bc_mlas.json

          # Commit the files (if there are changes) and push
          git commit -m "Automated update of BC MLA data" || exit 0
          git push
