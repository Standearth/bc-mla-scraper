name: Build and Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write # Needed to push the data back to the repo
  pages: write # Needed to deploy to GitHub Pages
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: packages/district-lookup/package-lock.json

      - name: Build District Lookup Widget
        working-directory: packages/district-lookup
        env:
          VITE_SEARCH_URL: ${{ vars.VITE_SEARCH_URL }}
          VITE_AZURE_VERSION: ${{ vars.VITE_AZURE_VERSION }}
          VITE_AZURE_KEY: ${{ secrets.VITE_AZURE_KEY }}
          VITE_GOOGLE_API_KEY: ${{ secrets.VITE_GOOGLE_API_KEY }}
        run: |
          npm ci
          npm run test
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Run Python Scraper
        working-directory: packages/scraper
        run: |
          python -m pip install --upgrade pip
          pip install .
          bc-mla-scraper --csv ../../public/bc_mlas.csv --json ../../public/bc_mlas.json

      - name: Commit and push data changes to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/bc_mlas.csv public/bc_mlas.json
          git diff --staged --quiet || (git commit -m "Automated nightly data update" && git push)

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./public"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
