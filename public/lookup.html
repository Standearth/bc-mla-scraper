<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BC Electoral District Lookup</title>
    <link rel="stylesheet" href="lookup.css" />
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background-color: #f4f7f6;
        color: #333;
        display: flex;
        justify-content: center;
        padding-top: 50px;
      }

      h2 {
        margin-bottom: 20px;
        color: #1a365d;
      }
    </style>
  </head>
  <body>
    <div class="bcdl-app-container">
      <div class="bcdl-app-header">
        <h2 style="margin-bottom: 0">Find Your Electoral District</h2>
        <a href="index.html" class="bcdl-btn-nav">🏛️ View Directory</a>
      </div>

      <bc-district-lookup
        id="district-lookup"
        placeholder="Start typing your BC address..."
      >
      </bc-district-lookup>

      <div id="result-card" class="bcdl-result-card" style="display: none">
        <div class="bcdl-card-header">
          <div id="address-output" class="bcdl-address-output"></div>
        </div>

        <div id="mla-output" class="bcdl-mla-output"></div>

        <details>
          <summary>View Raw API Data</summary>
          <pre id="raw-json"></pre>
        </details>
      </div>
    </div>

    <script src="district-lookup.js"></script>
    <script src="lookup.js"></script>
  </body>
</html>
