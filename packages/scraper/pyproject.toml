[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bc-mla-scraper"
version = "1.0.0"
description = "A scraper module to retrieve and format active MLA data from the British Columbia Legislature."
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Matthew Carroll" }
]
dependencies = [
    "requests>=2.33.1"
]

[project.scripts]
bc-mla-scraper = "bc_mla_scraper:main"
bc-mla-en = "engaging_networks:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3"
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["bc_mla_scraper", "engaging_networks", "formatters", "test_formatters"]
