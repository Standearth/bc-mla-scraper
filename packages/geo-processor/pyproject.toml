[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-processor"
version = "0.1.0"
description = "Tools for processing and simplifying BC Electoral boundaries."
requires-python = ">=3.14"
authors = [
    { name = "Matthew Carroll" }
]   
dependencies = [
    "geopandas>=1.1.3",
    "topojson>=1.10"
]

[project.scripts]
simplify-geojson = "simplify_geojson:main"
