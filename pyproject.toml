[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bc-mla-scraper"
version = "1.0.0"
description = "A scraper module to retrieve and format active MLA data from the British Columbia Legislature."
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Matthew Carroll" }
]
dependencies = [
    "requests>=2.25.0"
]

[project.scripts]
bc-mla-scraper = "bc_mla_scraper:main"
bc-mla-en = "engaging_networks:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.setuptools]
py-modules = ["bc_mla_scraper", "engaging_networks", "formatters"]
